name: Build and Publish (DRAFT CANDIDATE VERSION)

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
      - 'team/**'

env:
  FILE_PATH_OPENAPI: "src/main/resources/openapi"

permissions:
  contents: read

jobs:
  Artefact-Version:
    runs-on: ubuntu-latest
    outputs:
      artefact_version: ${{ steps.version.outputs.artefact_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Branch-aware version resolution. Avoids the tag-derived draft version
      # (which leaked the latest semver tag's label into every branch's artefact):
      #   team/** push -> <branch-name-without-team/>-<short-sha>
      #   main / other -> <projectVersion from gradle.properties>-<short-sha>
      - name: Resolve artefact version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "$REF_NAME" == team/* ]]; then
            BRANCH="${REF_NAME#team/}"
            BRANCH="${BRANCH//\//-}"
            VERSION="${BRANCH}-${SHORT_SHA}"
          else
            PROJECT_VERSION="$(grep -E '^projectVersion=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            VERSION="${PROJECT_VERSION}-${SHORT_SHA}"
          fi
          echo "Resolved artefact version: $VERSION"
          echo "artefact_version=$VERSION" >> "$GITHUB_OUTPUT"

  Update-Spec-Version:
    needs: [ Artefact-Version ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    outputs:
      upload_artifact_name: ${{ steps.update_spec.outputs.upload_artifact_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update OpenAPI Spec Version
        id: update_spec
        uses: hmcts/update-openapi-version@06f52a6f8f0d40e71c3669b52a77d622fd926761 # main 2026-07-23
        with:
          openapi_path: ${{ env.FILE_PATH_OPENAPI }}
          api_name: ${{ github.event.repository.name }}
          api_version: ${{ needs.Artefact-Version.outputs.artefact_version }}

  Test:
    name: Test - Java ${{ matrix.java }}
    strategy:
      matrix:
        java: [ 25 ]
    runs-on: ubuntu-latest
    needs: [ Artefact-Version, Update-Spec-Version ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: current

      - name: Download updated OpenAPI file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.Update-Spec-Version.outputs.upload_artifact_name }}
          path: ${{ env.FILE_PATH_OPENAPI }}

      - name: Gradle Build
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          JAVA_VERSION: ${{ matrix.java }}
        run: |
          echo "Building with ARTEFACT_VERSION=$ARTEFACT_VERSION using Java $JAVA_VERSION"
          ./gradlew build -DAPI_SPEC_VERSION=$ARTEFACT_VERSION

  Publish:
    name: Publish Artefact - Java ${{ matrix.java }}
    # Publish a draft candidate artefact on every push to main/master and team/** branches.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [ Artefact-Version, Update-Spec-Version, Test ]
    # gradle publish authenticates to GitHub Packages with GITHUB_TOKEN
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        java: [ 25 ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Download updated OpenAPI file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.Update-Spec-Version.outputs.upload_artifact_name }}
          path: ${{ env.FILE_PATH_OPENAPI }}

      - name: Gradle Publish
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          JAVA_VERSION: ${{ matrix.java }}
        run: |
          echo "Publishing artefact for ARTEFACT_VERSION=$ARTEFACT_VERSION using Java $JAVA_VERSION"
          ./gradlew build -x test publish \
            -DAPI_SPEC_VERSION=$ARTEFACT_VERSION \
            -DGITHUB_REPOSITORY=${{ github.repository }} \
            -DGITHUB_ACTOR=${{ github.actor }} \
            -DGITHUB_TOKEN=$GITHUB_TOKEN \
            -DAZURE_DEVOPS_ARTIFACT_USERNAME=$AZURE_DEVOPS_ARTIFACT_USERNAME \
            -DAZURE_DEVOPS_ARTIFACT_TOKEN=$AZURE_DEVOPS_ARTIFACT_TOKEN
