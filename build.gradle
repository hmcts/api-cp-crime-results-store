plugins {
  id 'java-library'
  id 'org.openapi.generator' version '7.25.0'
  id 'jacoco'
  id 'maven-publish'
  id "com.github.ben-manes.versions" version "0.64.0"
  id "org.cyclonedx.bom" version "3.4.1"
  id 'pmd'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('API_SPEC_VERSION') ?: '0.0.999'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/dependency.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/openapi.gradle")
  from("$rootDir/gradle/jar.gradle")
}

ext {
  springBootVersion = "4.1.1"
  lombokVersion = "1.18.48"
}

dependencies {
  // What the generated interfaces and models carry as annotations. Annotation-only jars with no
  // transitive dependencies, exposed to consumers so the compiled classes read cleanly there.
  // jakarta.validation-api is here only because the generator still marks required getters
  // @NotNull with useBeanValidation off; nothing in this jar validates.
  api "io.swagger.core.v3:swagger-annotations:2.2.55"
  api "com.fasterxml.jackson.core:jackson-annotations:2.22"
  api "jakarta.annotation:jakarta.annotation-api:3.0.0"
  api "jakarta.validation:jakarta.validation-api:3.1.1"

  // Spring web types in the interface signatures. The consumer is a Spring Boot web service that
  // already has them, so they are compile-time only here and the consumer's Boot BOM owns the versions.
  compileOnly platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
  compileOnly "org.springframework:spring-web"
  compileOnly "org.springframework:spring-context"
  compileOnly "jakarta.servlet:jakarta.servlet-api"

  testImplementation platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
  testImplementation "org.springframework:spring-web"
  testImplementation "org.springframework:spring-context"
  testImplementation "jakarta.servlet:jakarta.servlet-api"
  testImplementation "org.springframework.boot:spring-boot-starter-test:$springBootVersion"

  compileOnly "org.projectlombok:lombok:$lombokVersion"
  testCompileOnly "org.projectlombok:lombok:$lombokVersion"
  annotationProcessor "org.projectlombok:lombok:$lombokVersion"
  testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

  testImplementation(platform("org.junit:junit-bom:6.1.3"))
  testImplementation "org.junit.jupiter:junit-jupiter-api"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
